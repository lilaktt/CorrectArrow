def target = TARGETS[project.name - 'mc-']
def requested = project.findProperty('mc') as String
def mc = requested != null && target.tests.containsKey(requested) ? requested : target.tests.keySet().first()
def fabricApiVersion = target.tests[mc]

def mcKey = { String v ->
    def parts = v.split('\\.').collect { it as long }
    while (parts.size() < 3) parts << 0L
    parts[0] * 1_000_000L + parts[1] * 1_000L + parts[2]
}
long MC = mcKey(mc)
boolean obf = MC < mcKey('26.1')
boolean fabricGametest = MC >= mcKey('1.21.4')
def FLAGS = [OBF: obf, FABRIC_GAMETEST: fabricGametest]

def SWAPS = []
if (MC < mcKey('1.21')) {
    SWAPS += [
        [/Identifier\.(fromNamespaceAndPath|withDefaultNamespace|parse)\(/, 'new Identifier('],
        [/VertexConsumer;III\)V/, 'VertexConsumer;IIFFFF)V'],
    ]
}
if (MC < mcKey('1.21.11')) {
    SWAPS += [
        [/\bIdentifier\b/, 'ResourceLocation'],
        [/\.projectile\.arrow\./, '.projectile.'],
        [/\/projectile\/arrow\//, '/projectile/'],
        [/client\.model\.object\.projectile\.ArrowModel/, 'client.model.ArrowModel'],
        [/import org\.jspecify\.annotations\.Nullable;/, ''],
        [/@Nullable\s+/, ''],
    ]
}
if (MC < mcKey('26.1')) {
    SWAPS += [
        [/renderer\.state\.level\.CameraRenderState/, 'renderer.state.CameraRenderState'],
        [/renderer\/state\/level\/CameraRenderState/, 'renderer/state/CameraRenderState'],
    ]
}

def evalCond = { String expr, String where ->
    expr.split(/\|\|/).any { alternative ->
        alternative.split(/&&/).every { raw ->
            def term = raw.trim()
            def m = term =~ /^MC\s*(>=|<=|==|!=|>|<)\s*([0-9.]+)$/
            if (m.matches()) {
                long v = mcKey(m.group(2))
                switch (m.group(1)) {
                    case '>=': return MC >= v
                    case '<=': return MC <= v
                    case '>': return MC > v
                    case '<': return MC < v
                    case '==': return MC == v
                    default: return MC != v
                }
            }
            boolean negate = term.startsWith('!')
            def flag = negate ? term.substring(1).trim() : term
            if (!FLAGS.containsKey(flag)) {
                throw new GradleException("$where: unknown condition '$term'")
            }
            return FLAGS[flag] != negate
        }
    }
}

def preprocess = { String text, String where ->
    def out = new StringBuilder()
    def stack = []
    boolean active = true
    int lineNo = 0
    text.eachLine { line ->
        lineNo++
        def t = line.trim()
        if (t.startsWith('//#if ')) {
            boolean c = active && evalCond(t.substring(6), "$where:$lineNo")
            stack.add([active, c])
            active = c
        } else if (t.startsWith('//#elseif ')) {
            if (stack.isEmpty()) throw new GradleException("$where:$lineNo: //#elseif without //#if")
            def frame = stack[-1]
            boolean c = frame[0] && !frame[1] && evalCond(t.substring(10), "$where:$lineNo")
            if (c) frame[1] = true
            active = c
        } else if (t == '//#else') {
            if (stack.isEmpty()) throw new GradleException("$where:$lineNo: //#else without //#if")
            def frame = stack[-1]
            active = frame[0] && !frame[1]
            frame[1] = true
        } else if (t == '//#endif') {
            if (stack.isEmpty()) throw new GradleException("$where:$lineNo: //#endif without //#if")
            active = stack.removeLast()[0]
        } else if (active) {
            def kept = line
            SWAPS.each { swap -> kept = kept.replaceAll(swap[0], swap[1]) }
            out << kept
        }
        out << '\n'
    }
    if (!stack.isEmpty()) throw new GradleException("$where: unclosed //#if")
    out.toString()
}

def srcRoot = rootProject.file('src')
def preDir = layout.buildDirectory.dir('pre').get().asFile
def preprocessTask = tasks.register('preprocessSources') {
    inputs.dir(srcRoot)
    inputs.property('mc', mc)
    outputs.dir(preDir)
    doLast {
        project.delete(preDir)
        srcRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def rel = srcRoot.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            def out = new File(preDir, rel)
            out.parentFile.mkdirs()
            if (f.name.endsWith('.java') || f.name.endsWith('.json')) {
                out.setText(preprocess(f.getText('UTF-8'), "src/$rel"), 'UTF-8')
            } else {
                out.bytes = f.bytes
            }
        }
    }
}

base { archivesName = rootProject.name }
version = "${project.mod_version}+mc${target.label}"
group = project.maven_group

repositories {
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:$mc"
    if (obf) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${target.loader}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:$fabricApiVersion"
    } else {
        implementation "net.fabricmc:fabric-loader:${target.loader}"
        implementation "net.fabricmc.fabric-api:fabric-api:$fabricApiVersion"
    }
}

sourceSets {
    main {
        java.srcDirs = [new File(preDir, 'main/java')]
        resources.srcDirs = [new File(preDir, 'main/resources')]
    }
}

if (fabricGametest) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "correctarrow_test"
            enableGameTests = false
            eula = true
        }
    }
} else {
    sourceSets {
        gametest {
            compileClasspath += main.compileClasspath + main.output
            runtimeClasspath += main.runtimeClasspath + main.output
        }
    }
    loom {
        mods {
            correctarrow { sourceSet sourceSets.main }
            correctarrow_test { sourceSet sourceSets.gametest }
        }
        runs {
            clientGameTest {
                client()
                name = "Client Game Test"
                source sourceSets.gametest
                runDir "build/run/clientGameTest"
                vmArg "-Dcorrectarrow.harness=own"
            }
        }
    }
}
sourceSets.gametest.java.srcDirs = [new File(preDir, 'gametest/java')]
sourceSets.gametest.resources.srcDirs = [new File(preDir, 'gametest/resources')]

loom {
    runs.configureEach {
        if (name == "clientGameTest" && project.hasProperty("testOnly")) {
            vmArg "-Dcorrectarrow.test.only=${project.property('testOnly')}"
        }
    }
}

tasks.matching { it.name in ['compileJava', 'processResources', 'sourcesJar', 'compileGametestJava', 'processGametestResources'] }
        .configureEach { dependsOn preprocessTask }

processResources {
    def props = [version: project.version, minecraft_range: target.range, loader_version: obf ? '0.16.0' : target.loader,
                 java_version: target.java]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = target.java as int
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
}

jar {
    from(rootProject.file("LICENSE")) { rename { "${it}_correctarrow" } }
}

def testModJar = tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
def loomClass = { String name -> Class.forName(name, true, project.extensions.getByName('loom').getClass().classLoader) }
def testModProd = testModJar
def modProd = tasks.named('jar')
if (obf) {
    testModProd = tasks.register('remapGametestJar', loomClass('net.fabricmc.loom.task.RemapJarTask')) {
        inputFile = testModJar.flatMap { it.archiveFile }
        archiveClassifier = 'gametest'
        destinationDirectory = layout.buildDirectory.dir('devlibs')
        addNestedDependencies = false
    }
    modProd = tasks.named('remapJar')
}
def prodFabricApi = configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:$fabricApiVersion"))
prodFabricApi.transitive = true
prodFabricApi.exclude(group: 'net.fabricmc', module: 'fabric-loader')
tasks.register('prodClientGameTest', loomClass('net.fabricmc.loom.task.prod.ClientProductionRunTask')) {
    dependsOn modProd, testModProd
    mods.from(modProd.flatMap { it.archiveFile })
    mods.from(testModProd.flatMap { it.archiveFile })
    mods.from(prodFabricApi)
    useXVFB = false
    runDir = layout.buildDirectory.dir('run/prodClientGameTest')
    jvmArgs.add("-Dcorrectarrow.test.only=" + (project.findProperty('testOnly') ?: 'humanoid,modded,nomodel,sync,self,bow'))
    if (fabricGametest) {
        jvmArgs.add("-Dfabric.client.gametest")
    } else {
        jvmArgs.add("-Dcorrectarrow.harness=own")
    }
}
